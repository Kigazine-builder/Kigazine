<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kigazine v2.5</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #020617;
  color: white;
}

body {
  display: flex;
  min-height: 100vh;
  overflow-x: hidden;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  min-width: 260px;
  max-width: 260px;
  min-height: 100vh;
  padding: 18px;
  background: linear-gradient(180deg, #0f172a, #020617);
  border-right: 1px solid #1e293b;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  align-self: flex-start;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 25px;
  text-align: center;
  white-space: nowrap;
}

.nav-btn {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: none;
  border-radius: 10px;
  background: #0f172a;
  color: #cbd5f5;
  cursor: pointer;
  text-align: left;
  transition: background 0.2s, color 0.2s, transform 0.08s;
}

.nav-btn:hover {
  background: #1e293b;
  color: white;
}

.nav-btn:active {
  transform: translateY(1px);
}

.nav-btn.active {
  background: #3b82f6;
  color: white;
  font-weight: 700;
}

.section {
  margin-top: 20px;
  margin-bottom: 8px;
  font-size: 12px;
  opacity: 0.6;
}

.user-text {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.7;
  word-break: break-word;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  margin-bottom: 10px;
  border: none;
  border-radius: 8px;
  background: #0f172a;
  color: white;
}

textarea {
  height: 120px;
  resize: vertical;
}

/* MAIN */
.main {
  flex: 1;
  min-width: 0;
  width: calc(100vw - 260px);
  padding: 24px;
  overflow-x: hidden;
}

.page {
  display: none;
  max-width: 980px;
  width: 100%;
}

.page.active-page {
  display: block;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  background: #3b82f6;
  color: white;
  cursor: pointer;
}

button:hover { background: #2563eb; }
button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }

.danger { background: #ef4444; }
.danger:hover { background: #dc2626; }

/* MAGAZINES */
.mag {
  background: #0f172a;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  border: 1px solid #1e293b;
  overflow-wrap: anywhere;
}

.title { font-size: 18px; font-weight: bold; }
.author { font-size: 12px; opacity: 0.7; }

.actions {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

@media (max-width: 700px) {
  body {
    display: block;
  }

  .sidebar {
    width: 100%;
    min-width: 0;
    max-width: none;
    min-height: auto;
    position: static;
    border-right: none;
    border-bottom: 1px solid #1e293b;
  }

  .main {
    width: 100%;
    padding: 16px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<nav class="sidebar" aria-label="Kigazine navigation">
  <div class="logo">📘 Kigazine</div>

  <button class="nav-btn active" data-page="feed" type="button">🏠 Home</button>
  <button class="nav-btn" data-page="create" type="button">➕ Create</button>

  <div class="section">Account</div>

  <input id="username" placeholder="Enter username" autocomplete="username">
  <button type="button" onclick="setUser()">Login</button>

  <p id="currentUserText" class="user-text"></p>
</nav>

<!-- MAIN -->
<main class="main">

  <!-- CREATE PAGE -->
  <section id="createPage" class="page" data-page="create">
    <h2>Create Magazine</h2>

    <input id="title" placeholder="Title">
    <textarea id="content" placeholder="Write your magazine..."></textarea>

    <button type="button" onclick="createMag()">Publish</button>
  </section>

  <!-- FEED PAGE -->
  <section id="feedPage" class="page active-page" data-page="feed">
    <h2>🌍 Public Feed</h2>
    <div id="feed"></div>
  </section>

</main>

<script>
let currentUser = localStorage.getItem("user") || "";
let activePage = "feed";

function setUser() {
  const u = document.getElementById("username").value.trim();
  if (!u) return alert("Enter username");

  currentUser = u;
  localStorage.setItem("user", u);

  document.getElementById("currentUserText").innerText = "Logged in as: " + u;
  render();
}

/* LOAD USER TEXT ON START */
if (currentUser) {
  document.getElementById("currentUserText").innerText = "Logged in as: " + currentUser;
}

/* STORAGE */
function getMags() {
  try {
    return JSON.parse(localStorage.getItem("mags") || "[]");
  } catch {
    localStorage.removeItem("mags");
    return [];
  }
}

function saveMags(mags) {
  localStorage.setItem("mags", JSON.stringify(mags));
}

/* CREATE */
function createMag() {
  if (!currentUser) return alert("Login first!");

  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();

  if (!title || !content) return alert("Fill everything");

  const mags = getMags();

  mags.unshift({
    id: Date.now(),
    title,
    content,
    author: currentUser
  });

  saveMags(mags);

  document.getElementById("title").value = "";
  document.getElementById("content").value = "";

  render();
  show("feed");
}

/* DELETE */
function deleteMag(id) {
  saveMags(getMags().filter(m => m.id !== id));
  render();
}

/* EDIT */
function editMag(id) {
  const mags = getMags();
  const m = mags.find(x => x.id === id);
  if (!m) return;

  const t = prompt("Title", m.title);
  const c = prompt("Content", m.content);

  if (t && c) {
    m.title = t.trim();
    m.content = c.trim();
    saveMags(mags);
    render();
  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* RENDER */
function render() {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  getMags().forEach(m => {
    const div = document.createElement("article");
    div.className = "mag";

    div.innerHTML = `
      <div class="title">${escapeHtml(m.title)}</div>
      <div class="author">by ${escapeHtml(m.author)}</div>
      <p>${escapeHtml(m.content)}</p>
    `;

    const actions = document.createElement("div");
    actions.className = "actions";

    const view = document.createElement("button");
    view.type = "button";
    view.innerText = "View";
    view.onclick = () => {
      clearPressedButtonState();
      alert(m.content);
    };

    actions.appendChild(view);

    if (m.author === currentUser) {
      const edit = document.createElement("button");
      edit.type = "button";
      edit.innerText = "Edit";
      edit.onclick = () => {
        clearPressedButtonState();
        editMag(m.id);
      };

      const del = document.createElement("button");
      del.type = "button";
      del.innerText = "Delete";
      del.className = "danger";
      del.onclick = () => {
        clearPressedButtonState();
        deleteMag(m.id);
      };

      actions.appendChild(edit);
      actions.appendChild(del);
    }

    div.appendChild(actions);
    feed.appendChild(div);
  });
}

function clearPressedButtonState() {
  if (document.activeElement && typeof document.activeElement.blur === "function") {
    document.activeElement.blur();
  }
}

function updateActiveNav() {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === activePage);
    btn.setAttribute("aria-current", btn.dataset.page === activePage ? "page" : "false");
  });
}

function updateActivePage() {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.toggle("active-page", page.dataset.page === activePage);
  });
}

/* PAGE SWITCH */
function show(page) {
  activePage = page;
  updateActivePage();
  updateActiveNav();
  clearPressedButtonState();
}

document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => show(btn.dataset.page));
});

document.addEventListener("pointerup", clearPressedButtonState);

render();
show(activePage);
</script>

</body>
</html>
